name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  instantiate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Instantiate markers
        run: python scripts/instantiate.py --out /tmp/mint-integration-instantiated
      - name: Conformance
        run: python /tmp/mint-integration-instantiated/scripts/run_conformance.py
      - name: Tests
        working-directory: /tmp/mint-integration-instantiated
        run: |
          pip install --no-cache-dir pytest==9.1.1
          python -m pytest -q --strict-markers tests/test_conformance.py
  release-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Release Please tests
        run: |
          pip install --no-cache-dir pytest==9.1.1
          python -m pytest -q --strict-markers tests/test_release_train.py
